<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kaizen - AI Resume Builder</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="decorative-shapes">
        <span class="sparkle" style="top: 10%; left: 5%;">✦</span>
        <span class="sparkle" style="top: 20%; right: 10%;">✧</span>
        <span class="sparkle" style="top: 60%; left: 8%;">✦</span>
        <span class="sparkle" style="top: 80%; right: 5%;">✧</span>
        <span class="flower" style="top: 15%; left: 15%;">❀</span>
        <span class="flower" style="top: 70%; right: 20%;">✿</span>
    </div>

    <div class="container">

        <div class="hero">
            <div class="bow-container">
                <div class="bow">
                    <div class="bow-left-wing"></div>
                    <div class="bow-right-wing"></div>
                    <div class="bow-center-knot"></div>
                </div>
            </div>
            <h1>Kaizen</h1>
            <p>AI Resume Builder & Skill Analyzer</p>
        </div>

        <div class="form-grid">

            <div class="card">
                <h2>✦ User Information</h2>
                <input type="text" id="name" placeholder="Full Name">
                <input type="text" id="phone" placeholder="Phone Number">
                <input type="email" id="email" placeholder="Professional Email">
                <input type="text" id="location" placeholder="Location">
                <input type="text" id="linkedin" placeholder="LinkedIn URL">
                <textarea id="summary" placeholder="Professional Summary"></textarea>
            </div>

            <div class="card">
                <h2>✦ Education</h2>
                <input type="text" id="degree" placeholder="Degree">
                <input type="text" id="college" placeholder="College Name">
                <input type="text" id="graduation" placeholder="Graduation Year">
            </div>

            <div class="card">
                <h2>✦ Experience (Optional)</h2>
                <div id="experienceContainer">
                    <div class="experience-item">
                        <input type="text" class="jobTitle" placeholder="Job Title">
                        <input type="text" class="company" placeholder="Company Name">
                        <input type="text" class="duration" placeholder="Duration">
                    </div>
                </div>
                <button type="button" onclick="addExperience()" class="add-btn">+ Add Experience</button>
            </div>

            <div class="card">
                <h2>✦ Skills</h2>
                <textarea id="skills" placeholder="Enter skills separated by commas"></textarea>
                <div class="ai-suggestions">
                    <p class="suggestion-label">✨ AI Suggestions:</p>
                    <div class="suggestion-chips">
                        <button type="button" class="chip" onclick="addSkill('Leadership')">+ Leadership</button>
                        <button type="button" class="chip" onclick="addSkill('Communication')">+ Communication</button>
                        <button type="button" class="chip" onclick="addSkill('Problem Solving')">+ Problem Solving</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h2>✦ Hobbies</h2>
                <textarea id="hobbies" placeholder="Enter hobbies separated by commas"></textarea>
            </div>

            <div class="card">
                <h2>✦ Target Role</h2>
                <select id="role">
                    <option value="">Select a role...</option>
                    <option>Web Developer</option>
                    <option>Frontend Developer</option>
                    <option>Backend Developer</option>
                    <option>Full Stack Developer</option>
                    <option>Python Developer</option>
                    <option>AI Engineer</option>
                    <option>Data Analyst</option>
                    <option>Software Engineer</option>
                    <option>UI/UX Designer</option>
                    <option>Cybersecurity Analyst</option>
                </select>
            </div>

        </div>

        <div class="button-group">
            <button onclick="generateResume()" class="btn-primary">✨ Generate Resume</button>
            <button onclick="downloadPDF()" class="btn-secondary">↓ Download Resume (PDF)</button>
        </div>

        <div id="output"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
